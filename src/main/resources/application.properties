spring.application.name=devprofile

# ==========================================
# Ollama Configuration (Local Inference)
# ==========================================
ollama.base-url=${OLLAMA_BASE_URL}
ollama.model.embedding=${OLLAMA_MODEL_EMBEDDING}
ollama.model.chat=${OLLAMA_MODEL_CHAT}

# ==========================================
# Qdrant Cloud Vector Database
# ==========================================
qdrant.url=${QDRANT_URL}
qdrant.api-key=${QDRANT_API_KEY}
qdrant.collection-name=${QDRANT_COLLECTION_NAME}
qdrant.document.limit=${QDRANT_DOCUMENT_LIMIT}
qdrant.document.steam=false

# ==========================================
# Cohere Generative & Embedding AI
# ==========================================
cohere.base-url=${COHERE_BASE_URL}
cohere.api-key=${COHERE_API_KEY}
cohere.model.chat=${COHERE_MODEL_CHAT}
cohere.model.embed=${COHERE_MODEL_EMBED}

# ==========================================
# Security: API Key & Allowed CORS Origins
# ==========================================
app.security.api-key=${APP_SECURITY_API_KEY}
app.security.allowed-origins=${APP_ALLOWED_ORIGINS}

# ==========================================
# System Prompt Guardrails
# ==========================================
cohere.model.chat.systemMessage=${COHERE_SYSTEM_MESSAGE}